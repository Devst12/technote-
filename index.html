<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Login System | TechNoteCore</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <div class="left">
      <div class="overlay">
        <h1>TechNoteCore</h1>
        <p>Empowering productivity through smarter notes</p>
      </div>
    </div>
    <div class="right">
      <div class="login-card">
        <h2>Welcome Back</h2>
        <p id="error-msg" style="color: red; display: none; margin-bottom: 10px; font-weight: bold;"></p>
        <p id="success-msg" style="color: green; display: none; margin-bottom: 10px; font-weight: bold;">Login
          successful! Redirecting...</p>

        <form id="loginForm">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="your.email@example.com" required />
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
          <button type="submit" id="loginBtn">Sign In</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      // Disable button during login
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://localhost:5000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.success) {
          // Store authentication token and user information
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('userEmail', data.user.email);
          localStorage.setItem('userRole', data.user.role);

          // Show success message
          successMsg.textContent = 'Login successful! Redirecting...';
          successMsg.style.display = 'block';

          // Redirect based on user role
          setTimeout(() => {
            if (data.user.role === 'admin' || 'user' || 'superadmin') {
              window.location.href = "dashboard.html";
            } else {
              window.location.href = "dashboard.html";
            }
          }, 1000);

        } else {
          // Show error message
          errorMsg.textContent = data.message || 'Login failed';
          errorMsg.style.display = 'block';

          // Re-enable button
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In';
        }
      } catch (err) {
        console.error('Login error:', err);
        errorMsg.textContent = "Cannot connect to server. Please check if the backend is running.";
        errorMsg.style.display = 'block';

        // Re-enable button
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });

    // Check if user is already logged in
    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('authToken');
      const userRole = localStorage.getItem('userRole');

      if (token) {
        if (userRole === 'admin' || 'user' || 'superadmin') {
          window.location.href = "dashboard.html";
        } else {
          window.location.href = "dashboard.html";
        }
      }
    });
  </script>
</body>

</html>
